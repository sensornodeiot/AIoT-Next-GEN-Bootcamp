<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="30" width="200" height="330" rx="10" fill="#1F3864" stroke="#1F3864" stroke-width="2"/><text x="38" y="60" font-size="15" fill="#fff" font-weight="700" text-anchor="start">ESP32 board</text><text x="38" y="80" font-size="12" fill="#c7d7ec" font-weight="400" text-anchor="start">SSN32 · mini · DevKit</text><rect x="150" y="48" width="62" height="24" rx="4" fill="#2b4a7e" stroke="#2b4a7e" stroke-width="1"/><text x="181" y="65" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3V3</text><rect x="216" y="55" width="10" height="10" fill="#d4af37"/><rect x="150" y="188" width="62" height="24" rx="4" fill="#2b4a7e" stroke="#2b4a7e" stroke-width="1"/><text x="181" y="205" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">GPIO 2</text><rect x="216" y="195" width="10" height="10" fill="#d4af37"/><rect x="150" y="318" width="62" height="24" rx="4" fill="#2b4a7e" stroke="#2b4a7e" stroke-width="1"/><text x="181" y="335" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">GND</text><rect x="216" y="325" width="10" height="10" fill="#d4af37"/><line x1="226" y1="60" x2="560" y2="60" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="566" y="65" font-size="13" fill="#c0392b" font-weight="700" text-anchor="start">3V3 (or 5V)</text><line x1="420" y1="60" x2="420" y2="90" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><circle cx="420" cy="60" r="4.5" fill="#c0392b"/><rect x="390" y="90" width="60" height="60" rx="6" fill="#1b1b1b" stroke="#000" stroke-width="2"/><text x="420" y="112" font-size="16" fill="#ddd" font-weight="700" text-anchor="middle">+</text><text x="420" y="140" font-size="10" fill="#bbb" font-weight="400" text-anchor="middle">buzzer</text><line x1="420" y1="150" x2="420" y2="200" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><circle cx="420" cy="200" r="4.5" fill="#1F3864"/><line x1="420" y1="72" x2="500" y2="72" stroke="#1F3864" stroke-width="2.5" stroke-linecap="round"/><line x1="500" y1="72" x2="500" y2="92" stroke="#1F3864" stroke-width="2.5" stroke-linecap="round"/><path d="M486 140 L514 140 L500 112 Z" stroke="#1F3864" stroke-width="2" fill="#F2F6FB" stroke-linejoin="round" stroke-linecap="round"/><line x1="486" y1="110" x2="514" y2="110" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="500" y1="92" x2="500" y2="110" stroke="#1F3864" stroke-width="2.5" stroke-linecap="round"/><line x1="500" y1="140" x2="500" y2="186" stroke="#1F3864" stroke-width="2.5" stroke-linecap="round"/><line x1="500" y1="186" x2="420" y2="186" stroke="#1F3864" stroke-width="2.5" stroke-linecap="round"/><circle cx="420" cy="186" r="4.5" fill="#1F3864"/><text x="522" y="116" font-size="12" fill="#1F3864" font-weight="700" text-anchor="start">1N4007</text><text x="522" y="132" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">stripe (bar) towards +</text><circle cx="420" cy="245" r="38" fill="none" stroke="#1F3864" stroke-width="2.5"/><line x1="405" y1="225" x2="405" y2="265" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="405" y1="235" x2="432" y2="214" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><line x1="432" y1="214" x2="432" y2="186" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><line x1="405" y1="255" x2="432" y2="276" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><path d="M420 270 L432 276 L425 264" stroke="#1F3864" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="432" y1="276" x2="432" y2="330" stroke="#222222" stroke-width="3" stroke-linecap="round"/><line x1="226" y1="200" x2="300" y2="200" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="200" x2="300" y2="245" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><rect x="300" y="236" width="60" height="18" rx="3" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><line x1="360" y1="245" x2="405" y2="245" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><text x="330" y="232" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">5.1 kΩ</text><line x1="226" y1="330" x2="560" y2="330" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="432" cy="330" r="4.5" fill="#222222"/><text x="566" y="335" font-size="13" fill="#222222" font-weight="700" text-anchor="start">GND</text><text x="470" y="236" font-size="12" fill="#1F3864" font-weight="700" text-anchor="start">2N2222A</text><text x="470" y="252" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">B ← resistor</text><text x="470" y="222" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">C ↑ buzzer −</text><text x="470" y="290" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">E → GND</text><text x="680" y="70" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">The pin only switches</text><text x="680" y="89" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">the transistor (&lt; 1 mA)</text><text x="680" y="118" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">The buzzer current</text><text x="680" y="137" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">flows 3V3 → buzzer →</text><text x="680" y="154" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">C → E → GND, never</text><text x="680" y="171" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">through the ESP32</text><text x="680" y="200" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Same code as the LED</text><text x="680" y="219" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">GPIO 2 HIGH = beep</text></svg>