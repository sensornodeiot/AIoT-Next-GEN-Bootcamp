<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="240" y="26" font-size="13" fill="#1F3864" font-weight="700" text-anchor="middle">4 bands (beige body)</text><text x="530" y="26" font-size="13" fill="#1F3864" font-weight="700" text-anchor="middle">5 bands (blue body)</text><text x="20" y="62" font-size="16" fill="#1F3864" font-weight="700" text-anchor="start">220 Ω</text><text x="20" y="80" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">LED</text><line x1="120" y1="64" x2="360" y2="64" stroke="#9aa0a6" stroke-width="3" stroke-linecap="round"/><rect x="160" y="50" width="160" height="28" rx="12" fill="#e8d3a8" stroke="#8a7a5a" stroke-width="1"/><rect x="182" y="50" width="9" height="28" fill="#d22b2b"/><rect x="202" y="50" width="9" height="28" fill="#d22b2b"/><rect x="222" y="50" width="9" height="28" fill="#7b4a1e"/><rect x="296" y="50" width="9" height="28" fill="#c9a23a"/><line x1="410" y1="64" x2="650" y2="64" stroke="#9aa0a6" stroke-width="3" stroke-linecap="round"/><rect x="450" y="50" width="160" height="28" rx="12" fill="#8fb8de" stroke="#8a7a5a" stroke-width="1"/><rect x="472" y="50" width="9" height="28" fill="#d22b2b"/><rect x="492" y="50" width="9" height="28" fill="#d22b2b"/><rect x="512" y="50" width="9" height="28" fill="#111"/><rect x="532" y="50" width="9" height="28" fill="#111"/><rect x="586" y="50" width="9" height="28" fill="#7b4a1e"/><text x="20" y="124" font-size="16" fill="#1F3864" font-weight="700" text-anchor="start">4.7 kΩ</text><text x="20" y="142" font-size="11" fill