<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="120" width="90" height="26" rx="12" fill="#c9ced4" stroke="#8c939b" stroke-width="2"/><path d="M110 133 C 170 133 170 70 230 70 S 290 133 330 133" stroke="#222" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="64" y="112" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">steel tip = sensor</text><path d="M330 133 C 350 133 350 110 380 110" stroke="#c0392b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 133 C 350 133 350 133 380 133" stroke="#222222" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 133 C 350 133 350 156 380 156" stroke="#c9a400" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="380" y="92" width="70" height="82" rx="4" fill="#3fa34d" stroke="#2d7a39" stroke-width="2"/><circle cx="415" cy="110" r="8" fill="#bfc5cc" stroke="#888" stroke-width="1.5"/><line x1="410" y1="110" x2="420" y2="110" stroke="#666" stroke-width="2" stroke-linecap="round"/><circle cx="415" cy="133" r="8" fill="#bfc5cc" stroke="#888" stroke-width="1.5"/><line x1="410" y1="133" x2="420" y2="133" stroke="#666" stroke-width="2" stroke-linecap="round"/><circle cx="415" cy="156" r="8" fill="#bfc5cc" stroke="#888" stroke-width="1.5"/><line x1="410" y1="156" x2="420" y2="156" stroke="#666" stroke-width="2" stroke-linecap="round"/><text x="415" y="196" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">screw terminal</text><line x1="450" y1="110" x2="640" y2="110" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="648" y="115" font-size="13" fill="#c0392b" font-weight="700" text-anchor="start">3V3</text><line x1="450" y1="133" x2="640" y2="133" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="648" y="138" font-size="13" fill="#222222" font-weight="700" text-anchor="start">GND</text><line x1="450" y1="156" x2="640" y2="156" stroke="#c9a400" stroke-width="3" stroke-linecap="round"/><text x="648" y="161" font-size="13" fill="#9a7d00" font-weight="700" text-anchor="start">GPIO 32</text><line x1="540" y1="110" x2="540" y2="120" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><rect x="531" y="120" width="18" height="26" rx="3" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><line x1="540" y1="146" x2="540" y2="156" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><circle cx="540" cy="110" r="4.5" fill="#c0392b"/><circle cx="540" cy="156" r="4.5" fill="#c9a400"/><text x="560" y="238" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">4.7 kΩ (or 5.1 kΩ) from red (3V3)</text><text x="560" y="254" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">to yellow (DATA): the pull-up</text><line x1="548" y1="134" x2="560" y2="222" stroke="#1F3864" stroke-width="1.2" stroke-linecap="round"/><text x="730" y="50" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Red = 3V3</text><text x="730" y="81" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Black = GND</text><text x="730" y="112" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Yellow = DATA</text><text x="730" y="131" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">→ GPIO 32</text><text x="730" y="160" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Pull-up is required</text><text x="730" y="179" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">without it: "not found"</text><text x="730" y="208" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Other colours?</text><text x="730" y="227" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">check the seller's label</text></svg>