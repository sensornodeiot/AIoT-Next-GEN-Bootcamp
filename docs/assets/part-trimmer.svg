<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="110" y="50" width="150" height="150" rx="6" fill="#2f6fd6" stroke="#1d4fa8" stroke-width="2"/><circle cx="140" cy="78" r="16" fill="#d4af37" stroke="#a8862a" stroke-width="2"/><line x1="130" y1="70" x2="150" y2="86" stroke="#7a5c12" stroke-width="3" stroke-linecap="round"/><text x="185" y="140" font-size="18" fill="#e8f0ff" font-weight="700" text-anchor="middle">W202</text><text x="185" y="162" font-size="12" fill="#cfe0ff" font-weight="400" text-anchor="middle">3296</text><line x1="145" y1="200" x2="145" y2="240" stroke="#c9a640" stroke-width="5" stroke-linecap="round"/><line x1="145" y1="240" x2="145" y2="262" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="145" y="280" font-size="12" fill="#c0392b" font-weight="700" text-anchor="middle">3V3</text><text x="154" y="226" font-size="11" fill="#5b6472" font-weight="700" text-anchor="start">1</text><line x1="185" y1="200" x2="185" y2="240" stroke="#c9a640" stroke-width="5" stroke-linecap="round"/><line x1="185" y1="240" x2="185" y2="262" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round"/><text x="185" y="280" font-size="12" fill="#2a9d8f" font-weight="700" text-anchor="middle">GPIO 34</text><text x="194" y="226" font-size="11" fill="#5b6472" font-weight="700" text-anchor="start">2</text><line x1="225" y1="200" x2="225" y2="240" stroke="#c9a640" stroke-width="5" stroke-linecap="round"/><line x1="225" y1="240" x2="225" y2="262" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="225" y="280" font-size="12" fill="#222222" font-weight="700" text-anchor="middle">GND</text><text x="234" y="226" font-size="11" fill="#5b6472" font-weight="700" text-anchor="start">3</text><text x="140" y="36" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">brass screw: ≈25 turns</text><text x="330" y="50" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Middle pin = wiper</text><text x="330" y="69" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">straight to GPIO 34, no resistor</text><text x="330" y="98" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">The code on top is the value</text><text x="330" y="117" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">W202 = 2 kΩ, 103 = 10 kΩ: any works</text><text x="330" y="146" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">About 25 turns end to end</text><text x="330" y="165" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">a few turns barely move the %</text><text x="330" y="194" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">No end stop</text><text x="330" y="213" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">at either end it keeps turning without</text><text x="330" y="230" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">changing anything: turn the other way</text></svg>