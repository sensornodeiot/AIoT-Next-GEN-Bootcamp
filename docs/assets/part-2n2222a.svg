<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M90 40 L190 40 L190 120 A50 50 0 0 1 90 120 Z" stroke="#1b1b1b" stroke-width="2" fill="#2a2a2a" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="80" font-size="14" fill="#ddd" font-weight="700" text-anchor="middle">2N</text><text x="140" y="98" font-size="14" fill="#ddd" font-weight="700" text-anchor="middle">2222A</text><text x="140" y="30" font-size="12" fill="#5b6472" font-weight="400" text-anchor="middle">flat face towards you</text><line x1="110" y1="160" x2="110" y2="260" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/><text x="110" y="282" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle">E</text><line x1="140" y1="160" x2="140" y2="260" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/><text x="140" y="282" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle">B</text><line x1="170" y1="160" x2="170" y2="260" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/><text x="170" y="282" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle">C</text><text x="140" y="302" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">emitter · base · collector</text><circle cx="420" cy="150" r="56" fill="none" stroke="#1F3864" stroke-width="2.5"/><line x1="400" y1="120" x2="400" y2="180" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="330" y1="150" x2="400" y2="150" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><text x="326" y="136" font-size="13" fill="#d9822b" font-weight="700" text-anchor="end">B ← GPIO 2</text><line x1="400" y1="132" x2="440" y2="104" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><line x1="440" y1="104" x2="440" y2="60" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><text x="450" y="70" font-size="13" fill="#1F3864" font-weight="700" text-anchor="start">C → buzzer −</text><line x1="400" y1="168" x2="440" y2="196" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><path d="M428 182 L440 196 L422 194" stroke="#1F3864" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="440" y1="196" x2="440" y2="240" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="450" y="236" font-size="13" fill="#222222" font-weight="700" text-anchor="start">E → GND</text><text x="345" y="140" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">5.1 kΩ</text><text x="600" y="50" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">NPN transistor</text><text x="600" y="69" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">a tiny current into B lets a</text><text x="600" y="86" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">big current flow C → E</text><text x="600" y="115" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Legs: E B C</text><text x="600" y="134" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">flat face towards you, legs down</text><text x="600" y="163" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">PNP parts won’t work here</text><text x="600" y="182" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">S8550, S9012: check the print</text></svg>