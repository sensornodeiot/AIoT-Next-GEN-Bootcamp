<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="170" y="26" font-size="13" fill="#1F3864" font-weight="700" text-anchor="middle">inside the potentiometer</text><path d="M90 190 A80 80 0 1 1 250 190" stroke="#7b4a1e" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="170" y1="140" x2="214" y2="92" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><circle cx="170" cy="140" r="9" fill="#1F3864"/><circle cx="214" cy="92" r="7" fill="#d4af37"/><line x1="90" y1="190" x2="90" y2="250" stroke="#c9a640" stroke-width="5" stroke-linecap="round"/><line x1="170" y1="140" x2="170" y2="250" stroke="#c9a640" stroke-width="5" stroke-linecap="round"/><line x1="250" y1="190" x2="250" y2="250" stroke="#c9a640" stroke-width="5" stroke-linecap="round"/><line x1="90" y1="250" x2="90" y2="280" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="170" y1="250" x2="170" y2="280" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round"/><line x1="250" y1="250" x2="250" y2="280" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="90" y="300" font-size="13" fill="#c0392b" font-weight="700" text-anchor="middle">3V3</text><text x="170" y="300" font-size="13" fill="#2a9d8f" font-weight="700" text-anchor="middle">GPIO 34</text><text x="250" y="300" font-size="13" fill="#222222" font-weight="700" text-anchor="middle">GND</text><text x="90" y="240" font-size="12" fill="#5b6472" font-weight="700" text-anchor="middle">1</text><text x="184" y="240" font-size="12" fill="#5b6472" font-weight="700" text-anchor="middle">2</text><text x="262" y="240" font-size="12" fill="#5b6472" font-weight="700" text-anchor="middle">3</text><text x="62" y="150" font-size="12" fill="#c0392b" font-weight="600" text-anchor="end">3.3 V end</text><text x="282" y="150" font-size="12" fill="#222222" font-weight="600" text-anchor="start">0 V end</text><text x="232" y="84" font-size="12" fill="#1F3864" font-weight="700" text-anchor="start">wiper</text><path d="M300 120 A60 60 0 0 0 300 60" stroke="#6f8f2f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ag)"/><text x="312" y="98" font-size="12" fill="#6f8f2f" font-weight="700" text-anchor="start">turn the knob</text><circle cx="420" cy="150" r="56" fill="#c9ced4" stroke="#8c939b" stroke-width="3"/><circle cx="420" cy="150" r="22" fill="#9aa1a9" stroke="#6b717a" stroke-width="2"/><line x1="420" y1="150" x2="420" y2="132" stroke="#444" stroke-width="4" stroke-linecap="round"/><rect x="383" y="200" width="14" height="40" rx="2" fill="#d9d9d9" stroke="#999" stroke-width="1.5"/><rect x="413" y="200" width="14" height="40" rx="2" fill="#d9d9d9" stroke="#999" stroke-width="1.5"/><rect x="443" y="200" width="14" height="40" rx="2" fill="#d9d9d9" stroke="#999" stroke-width="1.5"/><text x="420" y="262" font-size="12" fill="#5b6472" font-weight="400" text-anchor="middle">legs 1 · 2 · 3</text><text x="510" y="50" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Middle leg = the wiper</text><text x="510" y="69" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">it slides along the track and picks</text><text x="510" y="86" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">off any voltage from 0 to 3.3 V</text><text x="510" y="115" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Outer legs to 3V3 and GND</text><text x="510" y="134" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">either way round: swapping them</text><text x="510" y="151" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">only makes the % run backwards</text><text x="510" y="180" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">No extra resistor</text><text x="510" y="199" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">the track is already a voltage</text><text x="510" y="216" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">divider (Module 3)</text></svg>