0" width="280" height="230" rx="10" fill="#F2F6FB" stroke="#c7d7ec" stroke-width="2"/><text x="460" y="64" font-size="13" fill="#1F3864" font-weight="700" text-anchor="middle">inside a typical module</text><text x="340" y="116" font-size="13" fill="#c0392b" font-weight="700" text-anchor="start">VCC</text><line x1="380" y1="112" x2="420" y2="112" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><circle cx="420" cy="112" r="4.5" fill="#1F3864"/><circle cx="470" cy="112" r="4.5" fill="#1F3864"/><line x1="420" y1="112" x2="466" y2="96" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><text x="445" y="92" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">button</text><line x1="470" y1="112" x2="520" y2="112" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><line x1="520" y1="112" x2="520" y2="160" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><circle cx="520" cy="160" r="4.5" fill="#1F3864"/><line x1="520" y1="160" x2="585" y2="160" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><text x="585" y="180" font-size="13" fill="#2b6cb0" font-weight="700" text-anchor="end">OUT</text><rect x="511" y="175" width="18" height="50" rx="3" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><line x1="520" y1="160" x2="520" y2="175" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><line x1="520" y1="225" x2="520" y2="245" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="520" y="262" font-size="13" fill="#222222" font-weight="700" text-anchor="middle">GND</text><text x="536" y="205" font-size="11" fill="#1F3864" font-weight="700" text-anchor="start">10 kΩ</text><text x="625" y="50" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Released: OUT = LOW</text><text x="625" y="69" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">the resistor pulls it down</text><text x="625" y="98" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Pressed: OUT = HIGH</text><text x="625" y="117" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">the button joins it to VCC</text><text x="625" y="146" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Check yours</text><text x="625" y="165" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">some modules work the other</text><text x="625" y="182" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">way round: print digitalRead(4)</text><text x="625" y="199" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">and press</text></svg>