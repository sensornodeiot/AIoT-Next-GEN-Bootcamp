<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="300" y="20" width="60" height="240" fill="#e6e9ee"/><text x="330" y="280" font-size="12" fill="#5b6472" font-weight="400" text-anchor="middle">centre gap</text><rect x="250" y="60" width="160" height="160" rx="8" fill="#2d2d2d" stroke="#111" stroke-width="2"/><circle cx="330" cy="140" r="42" fill="#111" stroke="#555" stroke-width="3"/><line x1="250" y1="80" x2="210" y2="80" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><circle cx="210" cy="80" r="7" fill="#9aa0a6"/><line x1="410" y1="80" x2="450" y2="80" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><circle cx="450" cy="80" r="7" fill="#9aa0a6"/><line x1="250" y1="200" x2="210" y2="200" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><circle cx="210" cy="200" r="7" fill="#9aa0a6"/><line x1="410" y1="200" x2="450" y2="200" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><circle cx="450" cy="200" r="7" fill="#9aa0a6"/><line x1="210" y1="80" x2="450" y2="80" stroke="#6f8f2f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="210" y1="200" x2="450" y2="200" stroke="#6f8f2f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><text x="330" y="50" font-size="12" fill="#6f8f2f" font-weight="700" text-anchor="middle">always connected</text><text x="330" y="240" font-size="12" fill="#6f8f2f" font-weight="700" text-anchor="middle">always connected</text><line x1="210" y1="80" x2="120" y2="80" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><text x="112" y="85" font-size="14" fill="#2b6cb0" font-weight="700" text-anchor="end">GPIO 4</text><line x1="450" y1="200" x2="540" y2="200" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="548" y="205" font-size="14" fill="#222222" font-weight="700" text-anchor="start">GND</text><text x="600" y="100" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Pressing the cap joins</text><text x="600" y="120" font-size="14" fill="#1F3864" font-weight="400" text-anchor="start">the top pair to the bottom pair.</text><text x="600" y="160" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Use two diagonal legs:</text><text x="600" y="180" font-size="14" fill="#1F3864" font-weight="400" text-anchor="start">they are always in different pairs,</text><text x="600" y="200" font-size="14" fill="#1F3864" font-weight="400" text-anchor="start">so it works either way round.</text></svg>