<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M70 140 L70 70 A45 45 0 0 1 160 70 L160 140 Z" stroke="#9aa6b5" stroke-width="2" fill="#e9eef5" stroke-linejoin="round" stroke-linecap="round"/><path d="M62 140 L168 140 L168 156 L62 156 Z" stroke="#9aa6b5" stroke-width="2" fill="#dfe5ee" stroke-linejoin="round" stroke-linecap="round"/><line x1="80" y1="156" x2="80" y2="250" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/><text x="80" y="268" font-size="14" fill="#d22b2b" font-weight="700" text-anchor="middle">R</text><line x1="103" y1="156" x2="103" y2="290" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/><text x="103" y="308" font-size="14" fill="#222222" font-weight="700" text-anchor="middle">−</text><line x1="127" y1="156" x2="127" y2="260" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/><text x="127" y="278" font-size="14" fill="#2e9d3a" font-weight="700" text-anchor="middle">G</text><line x1="150" y1="156" x2="150" y2="250" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/><text x="150" y="268" font-size="14" fill="#2b6cb0" font-weight="700" text-anchor="middle">B</text><text x="103" y="334" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">longest = common</text><rect x="250" y="40" width="280" height="120" rx="8" fill="#EEF5DE" stroke="#6f8f2f" stroke-width="2"/><text x="390" y="64" font-size="14" fill="#6f8f2f" font-weight="700" text-anchor="middle">common-CATHODE ✓</text><text x="266" y="90" font-size="13" fill="#1F3864" font-weight="400" text-anchor="start">long leg → GND</text><text x="266" y="110" font-size="13" fill="#1F3864" font-weight="400" text-anchor="start">colour leg → 220 Ω → GPIO 2</text><text x="266" y="130" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">lights on HIGH, like the LED</text><rect x="250" y="180" width="280" height="120" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="2"/><text x="390" y="204" font-size="14" fill="#c0392b" font-weight="700" text-anchor="middle">common-ANODE ✗ on GPIO 2</text><text x="266" y="230" font-size="13" fill="#1F3864" font-weight="400" text-anchor="start">long leg → 3V3</text><text x="266" y="250" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">pulls GPIO 2 up while the board</text><text x="266" y="268" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">starts: uploads can fail</text><text x="560" y="50" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Leg order R − G B</text><text x="560" y="69" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">is the usual one; check yours</text><text x="560" y="98" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Which type is it?</text><text x="560" y="117" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">long leg to GND, one colour leg</text><text x="560" y="134" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">through 220 Ω to 3V3: it lights =</text><text x="560" y="151" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">common-cathode</text><text x="560" y="180" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">One colour per pin</text><text x="560" y="199" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">GPIO 2 drives one colour;</text><text x="560" y="216" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">use more pins for the others</text></svg>