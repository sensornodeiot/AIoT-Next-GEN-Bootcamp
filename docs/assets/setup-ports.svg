<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="20" width="470" height="250" rx="6" fill="#fff" stroke="#9aa5b5" stroke-width="2"/><rect x="20" y="20" width="470" height="30" rx="6" fill="#e9edf2"/><text x="36" y="40" font-size="13" fill="#222222" font-weight="600" text-anchor="start">Device Manager</text><text x="40" y="85" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">›</text><text x="58" y="85" font-size="14" fill="#222222" font-weight="400" text-anchor="start">Keyboards</text><text x="40" y="117" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">›</text><text x="58" y="117" font-size="14" fill="#222222" font-weight="400" text-anchor="start">Mice and other pointing devices</text><text x="40" y="149" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">⌄</text><text x="58" y="149" font-size="14" fill="#222222" font-weight="400" text-anchor="start">Ports (COM &amp; LPT)</text><rect x="56" y="161" width="420" height="28" rx="4" fill="#EEF5DE" stroke="#6f8f2f" stroke-width="2"/><text x="64" y="181" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start"></text><text x="82" y="181" font-size="14" fill="#222222" font-weight="600" text-anchor="start">Silicon Labs CP210x USB to UART Bridge (COM3)</text><text x="40" y="213" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">›</text><text x="58" y="213" font-size="14" fill="#222222" font-weight="400" text-anchor="start">Processors</text><text x="40" y="255" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">The COM number can be anything. CH340 / CH9102 boards show "USB-SERIAL CH340".</text><rect x="510" y="20" width="370" height="250" rx="6" fill="#111" stroke="#333" stroke-width="2"/><text x="526" y="52" font-size="15" fill="#e6e6e6" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">$ ls /dev/cu.*</text><text x="526" y="86" font-size="14" fill="#7a7a7a" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">/dev/cu.Bluetooth-Incoming-Port</text><text x="526" y="104" font-size="12" fill="#9a9a9a" font-weight="400" text-anchor="start">← not your board</text><rect x="520" y="118" width="350" height="28" rx="4" fill="#203a16" stroke="#6f8f2f" stroke-width="2"/><text x="526" y="138" font-size="14" fill="#b7e07e" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">/dev/cu.usbserial-0001</text><text x="526" y="172" font-size="12" fill="#9a9a9a" font-weight="400" text-anchor="start">also fine:</text><text x="526" y="194" font-size="13" fill="#cfe8a8" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">/dev/cu.SLAB_USBtoUART</text><text x="526" y="214" font-size="13" fill="#cfe8a8" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">/dev/cu.wchusbserial…</text><text x="526" y="255" font-size="11" fill="#9a9a9a" font-weight="400" text-anchor="start">Mac: Terminal</text></svg>