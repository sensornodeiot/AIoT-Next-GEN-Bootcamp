measure it: multimeter</text><text x="705" y="176" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">on Ω, part out of the</text><text x="705" y="193" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">breadboard</text></svg>