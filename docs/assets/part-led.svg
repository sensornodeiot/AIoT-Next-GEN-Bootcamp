<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M110 150 L110 75 A40 40 0 0 1 190 75 L190 150 Z" stroke="#a8323e" stroke-width="2" fill="#e8505b" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 150 L200 150 L200 166 L100 166 Z" stroke="#a8323e" stroke-width="2" fill="#d9434f" stroke-linejoin="round" stroke-linecap="round"/><line x1="200" y1="150" x2="200" y2="166" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M126 92 A24 24 0 0 1 150 64" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="130" y1="166" x2="130" y2="300" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/><line x1="170" y1="166" x2="170" y2="262" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/><text x="78" y="290" font-size="13" fill="#1F3864" font-weight="700" text-anchor="end">long leg</text><text x="78" y="307" font-size="12" fill="#5b6472" font-weight="400" text-anchor="end">anode (+)</text><line x1="82" y1="286" x2="124" y2="286" stroke="#1F3864" stroke-width="1.5" stroke-linecap="round"/><text x="222" y="256" font-size="13" fill="#1F3864" font-weight="700" text-anchor="start">short leg</text><text x="222" y="273" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">cathode (−)</text><line x1="218" y1="252" x2="176" y2="252" stroke="#1F3864" stroke-width="1.5" stroke-linecap="round"/><text x="222" y="162" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">flat edge = cathode side</text><line x1="218" y1="158" x2="204" y2="158" stroke="#1F3864" stroke-width="1.5" stroke-linecap="round"/><text x="330" y="110" font-size="13" fill="#d9822b" font-weight="700" text-anchor="start">GPIO 2</text><line x1="388" y1="105" x2="420" y2="105" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><rect x="420" y="96" width="60" height="18" rx="3" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><text x="450" y="90" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">220 Ω</text><line x1="480" y1="105" x2="510" y2="105" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><path d="M510 90 L510 120 L536 105 Z" stroke="#6f8f2f" stroke-width="2.5" fill="#EEF5DE" stroke-linejoin="round" stroke-linecap="round"/><line x1="538" y1="90" x2="538" y2="120" stroke="#6f8f2f" stroke-width="3" stroke-linecap="round"/><line x1="538" y1="105" x2="570" y2="105" stroke="#222222" stroke-width="3" stroke-linecap="round"/><line x1="570" y1="105" x2="570" y2="150" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="570" y="172" font-size="13" fill="#222222" font-weight="700" text-anchor="middle">GND</text><text x="496" y="145" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">long leg</text><text x="540" y="145" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">short</text><text x="640" y="46" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Long leg towards the pin</text><text x="640" y="65" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">through the 220 Ω resistor</text><text x="640" y="94" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Short leg to GND</text><text x="640" y="113" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">the side with the flat edge</text><text x="640" y="142" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Stays dark?</text><text x="640" y="161" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">it is in the wrong way round:</text><text x="640" y="178" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">turn it, nothing is damaged</text></svg>