<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><line x1="40" y1="70" x2="360" y2="70" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/><rect x="130" y="48" width="140" height="44" rx="8" fill="#1b1b1b" stroke="#000" stroke-width="2"/><rect x="240" y="48" width="16" height="44" fill="#c9ced4"/><text x="190" y="76" font-size="13" fill="#ddd" font-weight="700" text-anchor="middle">1N4007</text><text x="248" y="116" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">stripe = cathode (−)</text><line x1="40" y1="170" x2="170" y2="170" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><path d="M170 150 L170 190 L206 170 Z" stroke="#1F3864" stroke-width="2.5" fill="#F2F6FB" stroke-linejoin="round" stroke-linecap="round"/><line x1="208" y1="150" x2="208" y2="190" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="208" y1="170" x2="360" y2="170" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><text x="208" y="212" font-size="12" fill="#5b6472" font-weight="400" text-anchor="middle">the bar in the symbol = the stripe</text><text x="420" y="50" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Across the buzzer</text><text x="420" y="69" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">stripe towards the + side</text><text x="420" y="98" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Why</text><text x="420" y="117" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">the buzzer has a coil: when it switches</text><text x="420" y="134" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">off it kicks back a voltage spike;</text><text x="420" y="151" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">the diode soaks it up so the</text><text x="420" y="168" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">transistor is safe</text><text x="420" y="197" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Relays and motors too</text><text x="420" y="216" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">anything with a coil gets one</text></svg>