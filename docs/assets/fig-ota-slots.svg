        <rect x="20" y="20" width="140" height="150" rx="12" fill="#1F3864"/><text x="90" y="60" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">slot A</text><text x="90" y="100" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1.0.0</text><text x="90" y="135" text-anchor="middle" fill="#c7d7ec" font-size="13">running</text>
        <rect x="200" y="20" width="140" height="150" rx="12" fill="#EEF5DE" stroke="#6f8f2f" stroke-width="2" stroke-dasharray="6 4"/><text x="270" y="60" text-anchor="middle" fill="#1F3864" font-size="15" font-weight="700">slot B</text><text x="270" y="100" text-anchor="middle" fill="#6f8f2f" font-size="22" font-weight="700">1.0.1</text><text x="270" y="135" text-anchor="middle" fill="#5b6472" font-size="13">writing…</text>
