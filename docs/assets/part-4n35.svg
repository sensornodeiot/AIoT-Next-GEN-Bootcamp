<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3864"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8f2f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="250" y="60" width="170" height="200" rx="6" fill="#1b1b1b" stroke="#000" stroke-width="2"/><circle cx="270" cy="82" r="6" fill="#555"/><text x="335" y="246" font-size="16" fill="#ccc" font-weight="700" text-anchor="middle">4N35</text><line x1="220" y1="100" x2="250" y2="100" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><text x="262" y="105" font-size="12" fill="#ccc" font-weight="700" text-anchor="start">1</text><line x1="220" y1="160" x2="250" y2="160" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><text x="262" y="165" font-size="12" fill="#ccc" font-weight="700" text-anchor="start">2</text><line x1="220" y1="220" x2="250" y2="220" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><text x="262" y="225" font-size="12" fill="#ccc" font-weight="700" text-anchor="start">3</text><line x1="420" y1="100" x2="450" y2="100" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><text x="406" y="105" font-size="12" fill="#ccc" font-weight="700" text-anchor="end">6</text><line x1="420" y1="160" x2="450" y2="160" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><text x="406" y="165" font-size="12" fill="#ccc" font-weight="700" text-anchor="end">5</text><line x1="420" y1="220" x2="450" y2="220" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/><text x="406" y="225" font-size="12" fill="#ccc" font-weight="700" text-anchor="end">4</text><text x="270" y="50" font-size="11" fill="#5b6472" font-weight="400" text-anchor="middle">● = pin 1</text><path d="M300 115 L300 145 L322 130 Z" stroke="#f5a623" stroke-width="2" fill="#f5a623" stroke-linejoin="round" stroke-linecap="round"/><line x1="324" y1="115" x2="324" y2="145" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/><path d="M330 128 l14 0 M330 136 l14 0" stroke="#f5a623" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="337" y="200" font-size="10" fill="#f5a623" font-weight="400" text-anchor="middle">light</text><line x1="360" y1="115" x2="360" y2="145" stroke="#bbb" stroke-width="3" stroke-linecap="round"/><text x="30" y="95" font-size="13" fill="#d9822b" font-weight="700" text-anchor="start">signal</text><line x1="80" y1="100" x2="120" y2="100" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><rect x="120" y="91" width="60" height="18" rx="3" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><text x="150" y="86" font-size="11" fill="#1F3864" font-weight="700" text-anchor="middle">220 Ω</text><line x1="180" y1="100" x2="220" y2="100" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><line x1="150" y1="160" x2="220" y2="160" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="146" y="165" font-size="13" fill="#222222" font-weight="700" text-anchor="end">signal GND</text><text x="150" y="282" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">INPUT SIDE</text><line x1="450" y1="160" x2="560" y2="160" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><text x="566" y="165" font-size="13" fill="#2b6cb0" font-weight="700" text-anchor="start">GPIO 4</text><line x1="450" y1="220" x2="560" y2="220" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="566" y="225" font-size="13" fill="#222222" font-weight="700" text-anchor="start">GND</text><text x="520" y="282" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">BOARD SIDE</text><line x1="335" y1="30" x2="335" y2="290" stroke="#6f8f2f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="660" y="60" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">No wire between the sides</text><text x="660" y="79" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">light carries the signal</text><text x="660" y="108" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Signal on → GPIO 4 LOW</text><text x="660" y="127" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">INPUT_PULLUP, PRESSED = LOW</text><text x="660" y="156" font-size="14" fill="#1F3864" font-weight="700" text-anchor="start">Real 12–24 V signal?</text><text x="660" y="175" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">bigger resistor: ask your</text><text x="660" y="192" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">instructor first</text></svg>