<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" font-family="Segoe UI, Roboto, Arial, sans-serif" viewBox="0 0 900 200"><rect width="100%" height="100%" fill="#ffffff"/>
      <g text-anchor="middle">
        <rect x="20" y="20" width="270" height="130" rx="12" fill="#EEF5DE" stroke="#6f8f2f" stroke-width="2"/><text x="155" y="92" font-size="17" font-weight="700" fill="#1F3864">Birth</text><text x="155" y="115" font-size="14" fill="#5b6472">on connect: "online, v1.0.0"</text><text x="155" y="135" font-size="14" fill="#5b6472">→ indicator turns green</text>
        <rect x="315" y="20" width="270" height="130" rx="12" fill="#F2F6FB" stroke="#1F3864" stroke-width="2"/><text x="450" y="92" font-size="17" font-weight="700" fill="#1F3864">Keep-alive</text><text x="450" y="115" font-size="14" fill="#5b6472">automatic ping ~every 60 s</text><text x="450" y="135" font-size="14" fill="#5b6472">needs loop() to keep running</text>
        <rect x="610" y="20" width="270" height="130" rx="12" fill="#fbf2df" stroke="#e6cf95" stroke-width="2"/><text x="745" y="92" font-size="17" font-weight="700" fill="#8a5a00">Last will (LWT)</text><text x="745" y="115" font-size="14" fill="#5b6472">ping stops → broker posts</text><text x="745" y="135" font-size="14" fill="#5b6472">"offline" for the device</text>
        <text x="450" y="185" font-size="15" fill="#1F3864">That's why a long <tspan font-family="Consolas,monospace">delay()</tspan> is dangerous: no ping → the broker thinks you're gone</text>
      </g>
    </svg>